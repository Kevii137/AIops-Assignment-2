apiVersion: batch/v1
kind: Job
metadata:
  name: shard-validate-job
  labels:
    app: shard-validate
spec:
  completions: 8
  parallelism: 4
  completionMode: Indexed
  backoffLimit: 4
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: shard-validate
    spec:
      restartPolicy: Never
      containers:
        - name: validator
          image: shard-validator:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SHARD_DIR
              value: "/app/data"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "1000m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "256Mi"
